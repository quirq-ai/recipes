# Required check for this repo. Hand-written until infra-config generates builders for infra repos.
# Runs on every PR and in the merge queue, so it verifies the exact merge result.
name: presubmit
on:
  pull_request:
  merge_group:
  push:
    branches: [main]
# Every action is pinned to a full commit SHA (tag in the comment): a moved tag can't change CI.
permissions:
  contents: read
jobs:
  presubmit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # The CPython the manifests pin (3.14.8), until recipes uses the toolchain quirq-ai/toolchains
      # publishes (V0-TCH-01). The adapters check the minor version against the manifest.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        id: python
        with:
          python-version: "3.14.8"
      - run: python -m pip install --quiet -e ".[test]"
      - run: python -m pytest -q -p no:cacheprovider
      - name: agnosticism guard (plan §5.1)
        run: python tools/agnostic_guard.py
      # Adapters must agree with the kinds infra-config declares, read with qqcfg at a pinned commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: quirq-ai/infra-config
          ref: 87fef5f89104c91822068280f6949fa36d5eee0f  # TODO(expert): let rollers move this pin.
          path: .qq/infra-config
      - run: python -m pip install --quiet -r .qq/infra-config/requirements.txt
      - name: adapters match infra-config kinds.toml
        run: qqrecipes check-kinds --infra-config .qq/infra-config
      - name: python-service example through the adapters
        run: >-
          qqrecipes execute test --repo examples/python-service --out .qq/out/example-python
          --toolchain python="$(dirname "$(dirname "${{ steps.python.outputs.python-path }}")")"
      # V0-REC-02 done-when: xo-space builds and tests through the adapter. Its manifest is sync's
      # onboarding fixture until V0-ONB-01 lands infra/repo.toml in xo-space.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: quirq-ai/xo-space
          ref: c3cea98c8e70479b1f0cb8f871e28f8f6ee5a4f6  # TODO(expert): let rollers move this pin.
          path: .qq/xo-space
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: quirq-ai/sync
          ref: 8f624f4a7fe3abdab2c7b83376f1ae7772073fd4
          path: .qq/sync
      - name: xo-space builds and tests through the adapters
        run: >-
          qqrecipes execute test --repo .qq/xo-space --manifest .qq/sync/tests/fixtures/xo-space.repo.toml
          --out .qq/out/xo-space --toolchain python="$(dirname "$(dirname "${{ steps.python.outputs.python-path }}")")"
      # V0-REC-03 done-when: innernet builds and tests (typecheck: it has no tests) through the
      # adapter. Node and pnpm come from setup actions at the toolchains pins until V0-TCH-02 publishes.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "24.21.0"
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86  # v6.0.10
        with:
          version: "11.28.2"  # the pnpm quirq-ai/toolchains bundles with Node 24 (V0-TCH-02)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: quirq-ai/innernet
          ref: da9b84cf811f4358e3ee0b5d9d4388b69bf481e9  # TODO(expert): let rollers move this pin.
          path: .qq/innernet
      - name: innernet builds and tests through the adapter
        run: >-
          qqrecipes execute test --repo .qq/innernet --manifest .qq/sync/tests/fixtures/innernet.repo.toml
          --out .qq/out/innernet
      - name: node-app example through the adapter
        run: qqrecipes execute test --repo examples/node-app --out .qq/out/example-node
      # V0-REC-04 done-when: a planted input-handling bug in each kind is caught by a property test.
      # TODO(expert): repeat this in the gate once the merge queue is on (V0-ORG-03).
      - name: planted bug caught by a Hypothesis property test (python-service, pytest)
        run: >-
          python tools/check_planted_bug.py examples/python-service greet.py
          'name = " ".join(name.split())[:64] or "there"' 'name = name.strip()[:64] or "there"'
          test_greeting_is_one_bounded_line
          -- --toolchain python="$(dirname "$(dirname "${{ steps.python.outputs.python-path }}")")"
      - name: planted bug caught by a fast-check property test (node-app)
        run: >-
          python tools/check_planted_bug.py examples/node-app lib/slug.ts
          '.replace(/^-+|-+$/g, "")' '' 'always gives a safe, bounded slug'
      # V0-REC-05 done-when: the canary pipeline can deploy and probe both kinds. v0's canary test
      # environment is this runner: start the built artifact, probe it, tear it down.
      - name: deploy and probe python-service (example and xo-space)
        run: |
          qqrecipes execute deploy --repo examples/python-service --out .qq/out/deploy-example-python --toolchain python="$(dirname "$(dirname "${{ steps.python.outputs.python-path }}")")"
          qqrecipes execute deploy --repo .qq/xo-space --manifest .qq/sync/tests/fixtures/xo-space.repo.toml --target server --out .qq/out/deploy-xo-space --toolchain python="$(dirname "$(dirname "${{ steps.python.outputs.python-path }}")")"
      - name: deploy and probe node-app (example and innernet)
        run: |
          qqrecipes execute deploy --repo examples/node-app --out .qq/out/deploy-example-node
          qqrecipes execute deploy --repo .qq/innernet --manifest .qq/sync/tests/fixtures/innernet.repo.toml --out .qq/out/deploy-innernet
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: results
          path: .qq/out/
          if-no-files-found: ignore
