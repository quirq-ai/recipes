[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "qqrecipes"
version = "0.1.0"
description = "Adapters per target kind, one loader, and REAPI-shaped actions, for quirq infra (qq)."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
# sync is used by pinned commit (main after quirq-ai/sync#15, which adds `qqsync init`); qq pins the same one. TODO(expert): let rollers move this pin.
dependencies = ["qqsync @ git+https://github.com/quirq-ai/sync@aecb0fdb89f0d88b61a26052f5b3c26c48392841"]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[project.scripts]
qqrecipes = "qqrecipes.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
qqrecipes = ["adapters/*/*.mjs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
